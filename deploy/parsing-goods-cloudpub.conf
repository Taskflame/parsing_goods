# nginx gateway for the parsing_goods (procurement-search) web GUI published
# via CloudPub tunnel. Listens locally on 127.0.0.1:8092 and proxies to the
# FastAPI webapp (procurement_search.webapp) on 127.0.0.1:8011.
server {
    listen 127.0.0.1:8092;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads (Excel reports) and long-running report generation
        client_max_body_size 100M;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}