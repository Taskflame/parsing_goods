services:
  procurement-search:
    build: .
    # Порт слева — то самое "свободный порт локально на сервере", который
    # дальше публикует через HTTPS reverse-proxy (nginx/caddy/traefik —
    # уже существующая инфраструктура сервера, не часть этого репозитория).
    # Поменяйте левую часть, если 8000 на сервере занят другим сервисом —
    # правая (порт внутри контейнера) трогать не нужно.
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Персистентные данные — переживают пересборку/перезапуск контейнера.
      # Без этих volume'ов база доверенных поставщиков и история отчётов
      # исчезали бы при каждом `docker compose up --build`.
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped
