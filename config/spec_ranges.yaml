# Пороги типичности характеристик по категориям товара — используется
# attribute_extractor.classify_roles, чтобы отличить правдоподобную
# характеристику от подозрительного значения, которое, возможно, на самом
# деле индекс модели или опечатка (design-обсуждение: "hunter 3000 литров"
# — 3000 л абсурдно для бака бензогенератора, скорее это спутанный индекс
# модели "Hunter 3000"; не угадываем молча, выводим предупреждение).
#
# Категория определяется словарным совпадением ключевых слов (`keywords`)
# по чистому тексту товара запроса — НЕ через LLM и НЕ через
# config/categories.yaml (та таксономия — для базы доверенных поставщиков,
# другая по смыслу задача, см. trusted_suppliers.py). Отсутствие категории
# в этом файле или отсутствие диапазона для конкретной единицы — не
# ошибка, проверка просто пропускается (тот же принцип "нет данных — не
# штраф", что и везде в scoring.py).
#
# ranges: ключ — канонический код единицы из units.yaml; min/max — border
# правдоподобного диапазона; label — только для человекочитаемого текста
# предупреждения, на логику не влияет.

генератор_бензиновый:
  name: "бензогенератор"
  keywords: [генератор, бензогенератор]
  ranges:
    квт: {min: 0.5, max: 30, label: "мощность"}
    л:   {min: 3,   max: 60, label: "объём бака"}
