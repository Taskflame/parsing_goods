# Справочник единиц измерения для распознавания технических атрибутов в
# запросе байера ("2,5 квт" -> число+единица, а не часть названия товара).
# Ключ — канонический код единицы, значение — все варианты написания,
# которые встречаются в живых запросах и на сайтах поставщиков (кириллица/
# латиница, с точкой/без, сокращения). Тиражирование = добавить сюда новую
# единицу, без правки кода — тот же принцип, что и в categories.yaml.

# --- Мощность / энергия ---
квт:
  - квт
  - квт.
  - kw
  - kwt
  - киловатт
  - киловатта
вт:
  - вт
  - вт.
  - w
  - ватт
  - ватта
мвт:
  - мвт
  - mw
  - мегаватт
квтч:
  - квт*ч
  - квт·ч
  - квтч
  - kwh
  - киловатт-час

