# Справочник категорий закупок для LLM-классификатора (см.
# relevance_llm.classify_category) — используется, чтобы отобрать
# доверенных поставщиков по категории при поиске нового товара (см.
# pipeline.py, trusted_suppliers.py), а НЕ для нормализации/фильтрации
# самого запроса, как в прежнем categories.yaml.
#
# Прежний файл с этим именем был выпилен (см. docs/design_doc.md §4) по
# двум причинам разом: категорий было 3-4 — слишком мало для реальных
# разнородных запросов, и найденная категория ни на что не влияла дальше
# по пайплайну (okved/tnved/registries нигде не читались). Здесь оба
# условия отсутствуют: категорий на порядок больше, и у категории есть
# реальный потребитель — она ключ в базе доверенных поставщиков.
#
# Верхний уровень отраслевой таксономии закупок (рынки RM/FC/EE/EMS,
# исходный внешний справочник) — БЕЗ более глубокой разбивки на
# тех.группы/семейства (у некоторых категорий там сотни кодов вроде
# "COPPER SEMIS"/"WIRELESS MODULE" — это уровень для закупки компонентов
# под производство, а не для классификации разговорного запроса байера
# вроде "генератор бензиновый"). Если этого уровня на практике не хватит
# (LLM систематически путает две соседние категории) — тогда и добавлять
# более глубокий уровень, не раньше.
#
# EMS H9 из исходного справочника не включён — там нет русского названия
# (только код), классифицировать в безымянную категорию нечем.
#
# Ключ — код категории (стабильный, не меняется, используется как ключ в
# базе поставщиков). name — русское название, ровно то, что видит LLM при
# классификации. market — код рынка исходного справочника (RM = сырьё,
# FC = компоненты по чертежу заказчика, EE = электрооборудование,
# EMS = электронные услуги) — самим классификатором не используется,
# сохранён для справки/будущей группировки.

