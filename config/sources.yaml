# Конфиг источников (шаг [2] пайплайна — генерация кандидатов).
#
# pulscen.ru/optlist.ru (CatalogSource, CSS-селекторы) и DuckDuckGo убраны
# отсюда вместе с соответствующими модулями (design-обсуждение): у первых
# двух CSS-селекторы так и остались неоткалиброванными PLACEHOLDER'ами с
# самого начала (среда разработки не имела сетевого доступа к этим сайтам,
# см. docs/design_doc.md §11) — 0 кандидатов всегда; DuckDuckGo упёрся в
# JS-антибот-челлендж на html.duckduckgo.com (anomaly.js), недоступный без
# браузера. Активные источники сейчас — google_cse/yandex_search/
# yandex_gen_search ниже.

# Google Custom Search JSON API — официальный канал "поиск по всему
# интернету" (ТЗ п.4 "зарубежные источники, в т.ч. Alibaba"), см.
# sources/google_cse.py про то, почему официальный API, а не скрапинг
# выдачи. Ключ и Search Engine ID НЕ хранятся здесь — только через
# переменные окружения GOOGLE_CSE_API_KEY / GOOGLE_CSE_CX (см. README).
# Без них источник просто отключён, без ошибки.
google_cse:
  request_delay_seconds: 1.0
  timeout_seconds: 15
  max_results_per_query: 10
  # Тот же приём, что у yandex_search ниже — см. её комментарий.
  enrich_query: true

# Yandex Search API (Yandex Cloud) — платный, но принимает российские карты
# и лучше подходит под RU-рынок, см. sources/yandex_search.py про то, почему
# он появился как альтернатива Google CSE. Ключ и folder_id — только через
# переменные окружения YANDEX_SEARCH_API_KEY / YANDEX_FOLDER_ID (см. README).
yandex_search:
  request_delay_seconds: 1.0
  timeout_seconds: 15
  max_results_per_query: 10
  poll_interval_seconds: 1.0
  poll_timeout_seconds: 20
  # Добавляет "(поставщик | производитель | оптом)" к запросу перед отправкой
  # в Yandex — проверено вживую: без этого выдача склоняется к розничным
  # маркетплейсам (Ozon, Wildberries), с этим — к опту/производителям.
  enrich_query: true

# Генеративный ответ Yandex Search API ("gen search") — тот же
# YANDEX_SEARCH_API_KEY/YANDEX_FOLDER_ID, что и yandex_search выше, но
# отдельный явный флаг YANDEX_GEN_SEARCH_ENABLED=true (см. README) —
# заметно дороже классического поиска. См. sources/yandex_gen_search.py
# про то, почему это может дать более чистую выдачу, чем query-суффикс.
yandex_gen_search:
  timeout_seconds: 30
  request_delay_seconds: 1.0
  max_results_per_query: 10
  # true: в Candidate попадают только источники, которые LLM реально
  # процитировала в ответе (sources[].used=true) — проверено вживую:
  # avito.ru/pulscen.ru присутствовали в общем списке источников, но LLM
  # их не использовала, предпочла прямых дилеров.
  only_used_sources: true
